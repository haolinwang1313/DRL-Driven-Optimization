[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper02-repro"
version = "0.1.0"
description = "Public research code for surrogate-conditioned urban morphology analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.1",
  "scipy>=1.13",
  "scikit-learn>=1.2",
  "matplotlib>=3.8",
  "seaborn>=0.12",
  "torch>=2.3",
  "PyYAML>=6.0",
  "openpyxl>=3.0",
  "optuna>=4.7",
  "pymoo>=0.6.1.6",
  "cma>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["paper_repro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
